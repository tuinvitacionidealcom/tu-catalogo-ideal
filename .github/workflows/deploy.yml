name: Deploy via FTP to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Project
      run: |
        cd frontend
        npm run build

    - name: Prepare deploy files
      run: |
        # Copiar .htaccess al directorio de build
        cp .htaccess frontend/dist/.htaccess
        echo "✅ .htaccess copiado a dist/"
        
        # Mostrar contenido del dist para debug
        echo "📁 Contenido de frontend/dist/:"
        ls -la frontend/dist/

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 82.25.67.136
        username: u506439444.tucatalogoideal
        password: Morell@11
        port: 21
        protocol: ftps
        local-dir: ./frontend/dist/
        server-dir: ./public_html/
        dangerous-clean-slate: true
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store

