name: Deploy via FTP to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Project
      run: |
        cd frontend
        npm run build

    - name: Sync Files to Hostinger via SFTP
      uses: wlixcreative/sftp-deployer-action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        port: 65002
        password: ${{ secrets.FTP_PASSWORD }}
        local_path: './frontend/dist/*'
        remote_path: '/domains/tucatalogoideal.com/public_html/'
        sftp_only: true
